<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#1e293b" stroke-width="4" />

  <!-- Circuit Traces -->
  <g stroke="#00f2fe" stroke-width="4" stroke-linecap="round" opacity="0.4" fill="none">
    <path d="M64 160 H180 L220 220" />
    <circle cx="64" cy="160" r="6" fill="#00f2fe" />
    
    <path d="M448 160 H332 L292 220" />
    <circle cx="448" cy="160" r="6" fill="#00f2fe" />

    <path d="M64 352 H180 L220 292" />
    <circle cx="64" cy="352" r="6" fill="#00f2fe" />

    <path d="M448 352 H332 L292 292" />
    <circle cx="448" cy="352" r="6" fill="#00f2fe" />
  </g>

  <!-- Center Microcontroller / SoC -->
  <rect x="186" y="186" width="140" height="140" rx="20" fill="url(#chip)" stroke="url(#glow)" stroke-width="5" filter="url(#neon)" />
  
  <!-- Pins -->
  <g fill="#00f2fe" opacity="0.8">
    <rect x="210" y="172" width="12" height="14" rx="2" />
    <rect x="250" y="172" width="12" height="14" rx="2" />
    <rect x="290" y="172" width="12" height="14" rx="2" />

    <rect x="210" y="326" width="12" height="14" rx="2" />
    <rect x="250" y="326" width="12" height="14" rx="2" />
    <rect x="290" y="326" width="12" height="14" rx="2" />

    <rect x="172" y="210" width="14" height="12" rx="2" />
    <rect x="172" y="250" width="14" height="12" rx="2" />
    <rect x="172" y="290" width="14" height="12" rx="2" />

    <rect x="326" y="210" width="14" height="12" rx="2" />
    <rect x="326" y="250" width="14" height="12" rx="2" />
    <rect x="326" y="290" width="14" height="12" rx="2" />
  </g>

  <!-- Logo Typography / AI Symbol inside chip -->
  <text x="256" y="266" font-family="'Outfit', sans-serif" font-size="42" font-weight="800" fill="#00f2fe" text-anchor="middle" letter-spacing="1">AIoT</text>
  <circle cx="256" cy="216" r="4" fill="#10b981" filter="url(#neon)" />
</svg>
